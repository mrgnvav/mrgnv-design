<!-- Open Graph изображение для превью при partage -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1214;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="100" cy="100" r="80" fill="url(#accentGrad)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="url(#accentGrad)" opacity="0.1"/>
  
  <!-- Логотип M -->
  <text x="600" y="350" font-family="Unbounded, sans-serif" font-size="180" font-weight="800" text-anchor="middle" fill="url(#accentGrad)">M</text>
  
  <!-- Текст -->
  <text x="600" y="420" font-family="Manrope, sans-serif" font-size="48" font-weight="600" text-anchor="middle" fill="#eef4f2">MRGNV DESIGN</text>
  <text x="600" y="480" font-family="Manrope, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#8fa29d">Графический дизайн</text>
  
  <!-- Услуги -->
  <text x="600" y="560" font-family="Manrope, sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#2dd4bf">Брендинг • Логотипы • Соцсети • Полиграфия</text>
</svg>