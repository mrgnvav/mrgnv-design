<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — страница не найдена | MRGNV Design</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .nf__code {
      font-family: "Unbounded", Arial, sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #2dd4bf, #00a892);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 12px;
    }
    .nf p { color: #8fa29d; margin: 0 0 32px; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf__code">404</p>
      <p>Такой страницы нет — но сайт на месте.</p>
      <a class="btn btn--primary" href="/">На главную</a>
    </div>
  </main>
</body>
</html>
